name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          ZIP=$(ls *.zip | head -n1)
          unzip -q -o "$ZIP" -x ".github/*" "__MACOSX/*"
          rm "$ZIP"
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Add project files" || echo "nothing to commit"
          git push
